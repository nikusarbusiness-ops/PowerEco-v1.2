name: Build CoreEco

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Quellcode prüfen
        run: |
          test -f pom.xml || { echo "::error::pom.xml fehlt im Repo-Root"; exit 1; }
          test -f src/main/resources/plugin.yml || { echo "::error::src/main/resources/plugin.yml fehlt - der Ordner src wurde nicht hochgeladen"; exit 1; }
          test -f src/main/java/de/coreeco/CoreEco.java || { echo "::error::src/main/java/de/coreeco/CoreEco.java fehlt - der Ordner src wurde nicht hochgeladen"; exit 1; }

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Plugin bauen
        run: mvn -B clean package

      - name: JAR prüfen (plugin.yml und Hauptklasse müssen drin sein)
        run: |
          unzip -l target/CoreEco.jar
          unzip -l target/CoreEco.jar | grep -q "plugin.yml"
          unzip -l target/CoreEco.jar | grep -q "de/coreeco/CoreEco.class"

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CoreEco
          path: target/CoreEco.jar
          if-no-files-found: error

      - name: Release erstellen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/CoreEco.jar
